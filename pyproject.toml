[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versascribe"
version = "0.1.0"
description = "Local meeting capture, transcription, and analysis CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
    "anthropic>=0.30.0",
    "pydantic>=2.7.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
diarize = [
    "whisperx>=3.1.0",
]
gigaam = [
    "gigaam @ git+https://github.com/salute-developers/GigaAM.git",
    "torch>=2.0.0",
    "numpy<2",
    "pyannote.audio>=3.1.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
vs = "versascribe.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/versascribe"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: requires Whisper model download",
    "api: requires ANTHROPIC_API_KEY environment variable",
    "audio: requires audio hardware and BlackHole",
]
